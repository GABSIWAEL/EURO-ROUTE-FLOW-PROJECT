input {
  file {
    path => "/var/log/app/logstash.json"
    start_position => "beginning"
    codec => json
    type => "docker"
  }
}

filter {
  if [type] == "docker" {
    # Add default fields if not present
    if ![service] {
      mutate { add_field => { "service" => "euro-route-backend" } }
    }
    if ![environment] {
      mutate { add_field => { "environment" => "production" } }
    }
    
    # Extract exception information if present
    if [message] =~ /Exception|Error|ERROR|EXCEPTION/ {
      mutate {
        add_tag => [ "exception" ]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
