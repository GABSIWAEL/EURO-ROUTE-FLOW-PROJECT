services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: euro-route-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: euro_route_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - euro-route-network

  # Spring Boot Backend API
  backend:
    build:
      context: ./Backend_Api
      dockerfile: Dockerfile
    container_name: euro-route-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/euro_route_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8081:8080"
    networks:
      - euro-route-network

  # Frontend (Vite React)
  frontend:
    build:
      context: ./euro-route-flow
      dockerfile: Dockerfile
    container_name: euro-route-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8081/api
    depends_on:
      - backend
    networks:
      - euro-route-network

volumes:
  postgres_data:

networks:
  euro-route-network:
    driver: bridge
